<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <!-- Radiant Ruby Velvet -->
    <radialGradient id="rubyGlowHover" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="35%" stop-color="#c4152a"/>
      <stop offset="75%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#4a0008"/>
    </radialGradient>
    
    <!-- Intense Gold Sparkle -->
    <linearGradient id="goldHover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Outer Gold Aura Glow -->
    <filter id="goldAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.75" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="goldGlow"/>
      <feMerge>
        <feMergeNode in="goldGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="rotate(-15 18 18)" filter="url(#goldAura)">
    <!-- Outer Glow Silhouette -->
    <path d="M18 29.5 C17.3 28.7 5 19.5 5 12 C5 7.5 8.5 4 13 4 C15.5 4 16.8 5.4 18 6.6 C19.2 5.4 20.5 4 23 4 C27.5 4 31 7.5 31 12 C31 19.5 18.7 28.7 18 29.5 Z"
          fill="url(#rubyGlowHover)"
          stroke="url(#goldHover)"
          stroke-width="1.8"
          stroke-linejoin="round"/>
          
    <!-- Specular Highlight -->
    <path d="M9 8 C11 6.2 13.5 6.6 15 7.8 C13.5 8.5 11 9.8 10 12.8 C9.5 11 8.8 9.2 9 8 Z"
          fill="#FFFFFF"
          opacity="0.75"/>

    <!-- Sparkle Diamond Star at Point -->
    <path d="M9 5.5 L10 2.5 L11 5.5 L14 6.5 L11 7.5 L10 10.5 L9 7.5 L6 6.5 Z"
          fill="#FFF9C4"
          stroke="#FFD700"
          stroke-width="0.5"/>
  </g>
</svg>
