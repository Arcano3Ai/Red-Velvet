<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Velvet Ruby Gradient -->
    <radialGradient id="rubyGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e62038"/>
      <stop offset="40%" stop-color="#9b111e"/>
      <stop offset="85%" stop-color="#60020d"/>
      <stop offset="100%" stop-color="#380006"/>
    </radialGradient>
    <!-- Gold Metallic Border -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="velvetShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g transform="rotate(-15 16 16)" filter="url(#velvetShadow)">
    <!-- Main Heart Body -->
    <path d="M16 26.5 C15.4 25.8 5 17.5 5 11 C5 7 8 4 12 4 C14.2 4 15.3 5.2 16 6.2 C16.7 5.2 17.8 4 20 4 C24 4 27 7 27 11 C27 17.5 16.6 25.8 16 26.5 Z"
          fill="url(#rubyGlow)"
          stroke="url(#goldBorder)"
          stroke-width="1.3"
          stroke-linejoin="round"/>
    
    <!-- Top-left Gloss Highlight -->
    <path d="M8.5 7.5 C10.2 5.8 12.2 6.2 13.5 7.2 C12.2 7.8 10 9 9.2 11.5 C8.8 10 8.2 8.5 8.5 7.5 Z"
          fill="#FFFFFF"
          opacity="0.55"/>
          
    <!-- Pointer Hotspot Pin Indicator -->
    <circle cx="8" cy="6" r="1.5" fill="#FFE082" stroke="#60020d" stroke-width="0.5"/>
  </g>
</svg>
